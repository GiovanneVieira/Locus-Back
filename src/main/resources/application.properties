#POSTGRES CREDENTIALS
spring.application.name=dockerSpring
spring.datasource.url=jdbc:postgresql://${RDS_HOST}:${RDS_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace
server.port=8080

#JWT CREDENTIALS
api.security.token.secret=${JWT_KEY}
api.jwt.access.expiration=${JWT_ACCESS_EXPIRATION}
api.jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}
api.jwt.issuer=${JWT_ISSUER}

#OAUTH2 CREDENTIALS
spring.security.oauth2.client.registration.google.client-id=${OAUTH_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_GOOGLE_SECRET_KEY}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.facebook.client-id=${OAUTH_FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${OAUTH_FACEBOOK_SECRET_KEY}
spring.security.oauth2.client.registration.facebook.scope[0]=public_profile
spring.security.oauth2.client.registration.facebook.scope[1]=email
spring.security.oauth2.client.registration.facebook.user-info-authentication-method=query
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture

# ==========================================
# SWAGGER / SCALAR API REFERENCE
# ==========================================
# Enable/disable the Scalar API reference
scalar.enabled=true

# Ajustado para caminho relativo (evita quebrar no deploy da AWS/Nginx)
scalar.url=/v3/api-docs

# Interface Customization
scalar.theme=deepSpace
scalar.layout=modern
scalar.darkMode=true
scalar.hideSearch=false
scalar.customCss=body { font-family: 'Arial', sans-serif; }

# Content organization
scalar.operationTitleSource=path
scalar.tagSorter=alpha
scalar.operationSorter=method
scalar.documentDownloadType=both

# Search and navigation
scalar.searchHotKey=ctrl+k


#AWS CREDENTIALS
cloud.aws.credentials.access.key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret.key=${AWS_SECRET_KEY}
cloud.aws.credentials.region=${AWS_REGION}
cloud.aws.bucket.name=${AWS_BUCKET_NAME}

#SMTP CREDENTIALS
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_EMAIL}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#REDIS CREDENTIALS
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

#FRONTENDURL
spring.url.front=${FRONT_URL:http://localhost:5173}

#DEV ENVIRONMENT
spring.dev.environment=${SPRING_ENV:development}

#NGINX REVERSE PROXY
server.forward-headers-strategy=native

#SPRING AI

spring.ai.google.genai.api-key=${GEMINI_API_KEY}